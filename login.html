<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StudentOS - Your college life, organized.</title>
  <meta name="description" content="Sign in or register for StudentOS - the ultimate static student dashboard for managing tasks, exams, schedules, and CGPA.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Standalone Login Page Custom Styles */
    body.login-page-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app);
      position: relative;
      overflow-x: hidden;
      padding: 2rem 1rem;
    }

    /* Ambient Background Animated Blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: floatBlob 12s ease-in-out infinite alternate;
    }

    .bg-blob-1 {
      width: 380px;
      height: 380px;
      top: -100px;
      left: -100px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .bg-blob-2 {
      width: 420px;
      height: 420px;
      bottom: -120px;
      right: -100px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      animation-delay: -6s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Login Container Card */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
      padding: 2.5rem 2.25rem;
      backdrop-filter: blur(16px);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }

    /* Brand Header inside Card */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: var(--gradient-brand);
      color: #ffffff;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .login-brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .login-brand p {
      color: var(--text-muted);
      font-size: 0.925rem;
      margin-top: 0.35rem;
    }

    /* Navigation Tabs: Sign In / Register */
    .auth-tabs {
      display: flex;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 1.75rem;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem 1rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: calc(var(--radius-md) - 2px);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Auth Forms */
    .auth-form-container {
      display: none;
    }

    .auth-form-container.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group-wrapper {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle-btn:hover {
      color: var(--primary);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-full {
      width: 100%;
      padding: 0.85rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      justify-content: center;
      border-radius: var(--radius-md);
    }

    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin: 1.5rem 0;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider-text span {
      padding: 0 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .demo-login-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all var(--transition-fast);
    }

    .demo-login-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-style: solid;
    }

    .guest-continue-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .guest-continue-link strong {
      color: var(--primary);
    }

    .guest-continue-link:hover {
      color: var(--primary-hover);
    }

    /* Top Corner Header Bar for Theme Toggle & Back to App */
    .login-top-actions {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 20;
    }
  </style>
</head>
<body class="login-page-body">

  <!-- Ambient Blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <!-- Top Actions (Theme Toggle) -->
  <div class="login-top-actions">
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Dark Mode" title="Toggle Dark/Light Mode">
      <span class="theme-icon sun-icon">☀️</span>
      <span class="theme-icon moon-icon">🌙</span>
      <span class="theme-text">Dark Mode</span>
    </button>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <!-- Header Brand -->
      <div class="login-brand">
        <div class="login-brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <h1>StudentOS</h1>
        <p>Your college life, organized in one spot.</p>
      </div>

      <!-- Auth Mode Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
        <button class="auth-tab-btn" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <!-- SIGN IN FORM -->
      <div class="auth-form-container active" id="formSignIn">
        <form id="signInForm">
          <div class="form-group">
            <label for="loginEmail">Email Address or Student ID</label>
            <input type="text" id="loginEmail" class="form-control" placeholder="e.g. alex.smith@university.edu" required>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-group-wrapper">
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Toggle Password Visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" checked>
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link" onclick="openForgotModal(event)">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            <span>Sign In to Dashboard</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="divider-text">
          <span>or try demo</span>
        </div>

        <button type="button" class="demo-login-btn" onclick="loginAsDemo()">
          <span>⚡ One-Click Demo Student Login</span>
        </button>

        <a href="index.html" class="guest-continue-link">
          Continue to dashboard as <strong>Guest</strong> &rarr;
        </a>
      </div>

      <!-- CREATE ACCOUNT FORM -->
      <div class="auth-form-container" id="formSignUp">
        <form id="signUpForm">
          <div class="form-group">
            <label for="regFullName">Full Name *</label>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Alex Smith" required>
          </div>

          <div class="form-row">
            <div class="form-group col">
              <label for="regUniversity">University / College</label>
              <input type="text" id="regUniversity" class="form-control" placeholder="e.g. Stanford University">
            </div>
            <div class="form-group col">
              <label for="regMajor">Major / Branch</label>
              <input type="text" id="regMajor" class="form-control" placeholder="e.g. Computer Science">
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="alex.smith@university.edu" required>
          </div>

          <div class="form-group">
            <label for="regPassword">Password *</label>
            <div class="input-group-wrapper">
              <input type="password" id="regPassword" class="form-control" placeholder="At least 10 characters" minlength="10" required>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password *</label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="regTerms" required>
              <span>I agree to StudentOS Terms & Privacy</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            <span>Create Account & Continue</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </form>

        <a href="index.html" class="guest-continue-link">
          Continue to dashboard as <strong>Guest</strong> &rarr;
        </a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Reset Your Password</h3>
        <button class="modal-close-btn" onclick="closeForgotModal()">&times;</button>
      </div>
      <form id="forgotForm">
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">
          Enter your registered email address below and we will reset your local StudentOS passcode.
        </p>
        <div class="form-group">
          <label for="forgotEmail">Email Address *</label>
          <input type="email" id="forgotEmail" class="form-control" placeholder="your.email@university.edu" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeForgotModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Reset Passcode</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="vault.js"></script>
  <script>
    // Theme Switcher for Login Page
    document.addEventListener('DOMContentLoaded', () => {
      const themeBtn = document.getElementById('themeToggleBtn');
      const savedTheme = localStorage.getItem('studentos_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('studentos_theme', newTheme);
        showToast(`Switched to ${newTheme} mode`, 'info');
      });

      // Check if user is already logged in
      const existingUser = localStorage.getItem('studentos_user');
      if (existingUser) {
        try {
          const user = JSON.parse(existingUser);
          if (user && user.isLoggedIn) {
            // Already logged in - redirect to index
            window.location.href = 'index.html';
          }
        } catch (e) {}
      }
    });

    // Toast function for Login Page
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 3000);
    }

    // Switch between Sign In and Sign Up tabs
    function switchAuthTab(tab) {
      const tabSignIn = document.getElementById('tabSignIn');
      const tabSignUp = document.getElementById('tabSignUp');
      const formSignIn = document.getElementById('formSignIn');
      const formSignUp = document.getElementById('formSignUp');

      if (tab === 'signin') {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        formSignIn.classList.add('active');
        formSignUp.classList.remove('active');
      } else {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        formSignUp.classList.add('active');
        formSignIn.classList.remove('active');
      }
    }

    // Password Visibility Toggle
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }
    }

    // Sign In Form Submit
    document.getElementById('signInForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please enter both email/ID and password', 'danger');
        return;
      }

      const lockedSec = Vault.lockedFor(email);
      if (lockedSec > 0) {
        showToast(`Account locked due to failed attempts. Try again in ${lockedSec}s.`, 'danger');
        return;
      }

      // Find user in stored users list
      let users = [];
      try {
        users = JSON.parse(localStorage.getItem('studentos_users')) || [];
      } catch (e) {}

      const userIndex = users.findIndex(u => u.email.toLowerCase() === email.toLowerCase());
      const foundUser = userIndex !== -1 ? users[userIndex] : null;

      let isValid = false;

      if (foundUser) {
        if (foundUser.passwordHash) {
          isValid = await Vault.verify(password, foundUser.passwordHash);
        } else if (foundUser.password !== undefined) {
          isValid = Vault.constantTimeEqual(password, foundUser.password);
          if (isValid) {
            foundUser.passwordHash = await Vault.hash(password, 'pbkdf2_sha512');
            delete foundUser.password;
            users[userIndex] = foundUser;
            localStorage.setItem('studentos_users', JSON.stringify(users));
          }
        }
      }

      if (!isValid) {
        Vault.fail(email);
        showToast('Invalid password!', 'danger');
        return;
      }

      Vault.succeed(email);

      const userName = foundUser ? foundUser.name : email.split('@')[0].replace('.', ' ');
      const formattedName = userName.charAt(0).toUpperCase() + userName.slice(1);

      const userSession = {
        name: formattedName,
        email: email,
        university: foundUser ? foundUser.university : 'State University',
        major: foundUser ? foundUser.major : 'Computer Science',
        isLoggedIn: true,
        loginTime: new Date().toISOString()
      };

      localStorage.setItem('studentos_user', JSON.stringify(userSession));
      showToast(`Welcome back, ${formattedName}! Redirecting...`, 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    });

    // Create Account Form Submit
    document.getElementById('signUpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regFullName').value.trim();
      const university = document.getElementById('regUniversity').value.trim() || 'University';
      const major = document.getElementById('regMajor').value.trim() || 'General Studies';
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match!', 'danger');
        return;
      }

      const strResult = Vault.strength(password);
      if (!strResult.ok) {
        showToast(strResult.tip || 'Password is too weak!', 'danger');
        return;
      }

      // Save user account
      let users = [];
      try {
        users = JSON.parse(localStorage.getItem('studentos_users')) || [];
      } catch (e) {}

      // Check if email already exists
      if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        showToast('An account with this email already exists!', 'warning');
        switchAuthTab('signin');
        document.getElementById('loginEmail').value = email;
        return;
      }

      const passwordHash = await Vault.hash(password, 'pbkdf2_sha512');
      const newUser = { name, university, major, email, passwordHash };
      users.push(newUser);
      localStorage.setItem('studentos_users', JSON.stringify(users));

      // Auto Login
      const userSession = {
        name: name,
        email: email,
        university: university,
        major: major,
        isLoggedIn: true,
        loginTime: new Date().toISOString()
      };

      localStorage.setItem('studentos_user', JSON.stringify(userSession));
      showToast('Account created successfully! Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    });

    // Quick Demo Login
    function loginAsDemo() {
      const demoUser = {
        name: 'Alex Vance',
        email: 'alex.vance@college.edu',
        university: 'MIT Tech Institute',
        major: 'Software Engineering',
        isLoggedIn: true,
        loginTime: new Date().toISOString()
      };

      localStorage.setItem('studentos_user', JSON.stringify(demoUser));
      showToast('Logged in as Demo Student! Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    }

    // Forgot Password Modal Handlers
    function openForgotModal(e) {
      e.preventDefault();
      document.getElementById('forgotModal').classList.add('active');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.remove('active');
    }

    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      showToast(`Passcode reset instructions sent to ${email}`, 'success');
      closeForgotModal();
    });
  </script>
</body>
</html>
